<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mudança Salvador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: painel de controle da mudança, hero com contagem regressiva, depois blocos de trabalho em grade */
:root{--bg:#F6F1F3;--sf:#FFFFFF;--sf2:#EFE6EA;--fg:#2A1519;--mu:#7A6068;--bd:#E0D2D8;
--bordo:#6E1F2E;--rosa:#D63F7C;--rosa-s:#FBE3EC;--mil:#4F5D2F;--mil-s:#E6EBD3;--mos:#D9A22E;--mos-s:#FBF0D2;--ac-fg:#FFFFFF;--sh:0 1px 2px rgba(60,20,30,.06),0 6px 18px rgba(60,20,30,.06);
--fd:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--fb:'Figtree','Segoe UI',system-ui,sans-serif;--fm:'DM Mono',ui-monospace,Menlo,monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#180D11;--sf:#26151A;--sf2:#33202A;--fg:#F6E9EE;--mu:#B49AA5;--bd:#44303A;--bordo:#E58BA1;--rosa:#F0629A;--rosa-s:#44202F;--mil:#A9BC74;--mil-s:#2A3320;--mos:#E8B94F;--mos-s:#3A2F17;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#180D11;--sf:#26151A;--sf2:#33202A;--fg:#F6E9EE;--mu:#B49AA5;--bd:#44303A;--bordo:#E58BA1;--rosa:#F0629A;--rosa-s:#44202F;--mil:#A9BC74;--mil-s:#2A3320;--mos:#E8B94F;--mos-s:#3A2F17;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--fb);padding-inline:16px;padding-block:18px 60px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800;color:var(--bordo)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-h p{margin:0;color:var(--mu);font-size:.85rem}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}
/* hero */
.hero{background:var(--bordo);color:#fff;border-radius:22px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;position:relative;overflow:hidden;box-shadow:var(--sh)}
:root[data-theme="dark"] .hero,:root:not([data-theme="light"]) .hero{--hbg:#3b1019}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:#3B1019}}
:root[data-theme="dark"] .hero{background:#3B1019}
.hero .stripes{position:absolute;right:-40px;top:-30px;width:240px;height:240px;border-radius:50%;background:repeating-radial-gradient(circle,var(--rosa) 0 14px,transparent 14px 28px);opacity:.28;pointer-events:none}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pc{position:absolute;inset:0;display:grid;place-items:center;font:800 1.9rem var(--fd)}
.ring .pc small{display:block;font:500 .65rem var(--fb);opacity:.8;text-align:center;margin-top:-4px;letter-spacing:.06em;text-transform:uppercase}
.hero h1{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:800;line-height:1.05}
.hero .msg{margin:6px 0 12px;opacity:.9}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:.82rem}
.chip b{font-family:var(--fm);font-weight:500}
.theme{position:absolute;right:14px;top:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:4px 12px;font-size:.78rem;z-index:2}
@media(max-width:560px){.hero{grid-template-columns:1fr;justify-items:start;padding-top:44px}.ring{width:108px;height:108px}}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh);min-width:0}
.kpi .l{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mu)}
.kpi .v{font:700 1.45rem var(--fm);margin-top:2px;overflow-wrap:anywhere}
.kpi .s{font-size:.78rem;color:var(--mu)}
.kpi.ok .v{color:var(--mil)}.kpi.warn .v{color:var(--mos)}.kpi.bad .v{color:var(--rosa)}
.kpi.hl{background:var(--rosa);border-color:var(--rosa)}.kpi.hl .l,.kpi.hl .s{color:#fff;opacity:.9}.kpi.hl .v{color:#fff}
/* budget bar */
.bud{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.bar{display:flex;height:30px;border-radius:10px;overflow:hidden;background:var(--sf2);margin:10px 0 8px}
.bar i{display:block;height:100%;transition:width .5s}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;
